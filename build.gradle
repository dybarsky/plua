plugins {
    id 'com.android.application' version '9.5.1'
}

android {
    namespace = 'dmax.plua'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dmax.plua'
        minSdk = 23
        targetSdk = 36
        versionCode = 8
        versionName = '0.7'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Release signing is configured only when -PkeystorePassword (or ~/.gradle/gradle.properties) provides it,
    // so debug builds and CI work without the keystore.
    def keystorePwd = providers.gradleProperty('keystorePassword').orNull
    if (keystorePwd != null) {
        signingConfigs {
            release {
                storeFile = file(System.getProperty('user.home') + '/.android/dmax.keystore')
                storePassword = keystorePwd
                keyAlias = 'dmax'
                keyPassword = keystorePwd
            }
        }
    }

    buildTypes {
        release {
            if (keystorePwd != null) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = false
            proguardFile 'proguard-android.txt'
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = true
        htmlReport = true
        xmlReport = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'com.google.android.material:material:1.14.0'

    // dagger2 dependencies
    implementation 'com.google.dagger:dagger:2.60.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.60.1'

    testImplementation 'junit:junit:4.13.2'
}
